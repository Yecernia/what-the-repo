services:
  api:
    environment:
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
    secrets:
      - free_provider_api_key

  analysis-worker:
    environment:
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
    secrets:
      - free_provider_api_key

  scheduler:
    environment:
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
    secrets:
      - free_provider_api_key

  migration:
    environment:
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
    secrets:
      - free_provider_api_key

secrets:
  free_provider_api_key:
    file: ${WHAT_THE_REPO_FREE_PROVIDER_API_KEY_SOURCE:?set an explicit free Provider key file path}
