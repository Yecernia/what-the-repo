# Optional generic hardening and file-based secrets; not a production-instance snapshot.
# Pair with compose.runtime.yaml. Set machine-specific resource limits in an ignored override.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/postgres_backup_access_key_id
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/postgres_backup_secret_access_key
      AWS_SESSION_TOKEN: ""
      AWS_SESSION_TOKEN_FILE: ""
    secrets:
      - postgres_admin_password
      - postgres_backup_access_key_id
      - postgres_backup_secret_access_key
    pids_limit: 512

  postgres-backup:
    environment:
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/postgres_admin_password
      AWS_ACCESS_KEY_ID: ""
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/postgres_backup_access_key_id
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/postgres_backup_secret_access_key
      AWS_SESSION_TOKEN: ""
      AWS_SESSION_TOKEN_FILE: ""
    secrets:
      - postgres_admin_password
      - postgres_backup_access_key_id
      - postgres_backup_secret_access_key
    pids_limit: 256

  redis:
    pids_limit: 256

  postgres-role-bootstrap:
    environment:
      PGPASSWORD: ""
      PGPASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_RUNTIME_PASSWORD: ""
      POSTGRES_RUNTIME_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    secrets:
      - postgres_admin_password
      - postgres_runtime_password
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  migration:
    environment:
      <<: &clear-server-secrets
        DATABASE_URL: ""
        DATABASE_URL_FILE: ""
        GITHUB_OAUTH_CLIENT_SECRET: ""
        GITHUB_OAUTH_CLIENT_SECRET_FILE: ""
        WHAT_THE_REPO_SESSION_SECRET: ""
        WHAT_THE_REPO_SESSION_SECRET_FILE: ""
        WHAT_THE_REPO_KEY_ENCRYPTION_SECRET: ""
        WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: ""
        WHAT_THE_REPO_FREE_PROVIDER_API_KEY: ""
        WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: ""
        WHAT_THE_REPO_FEEDBACK_PROVIDER_API_KEY: ""
        WHAT_THE_REPO_FEEDBACK_PROVIDER_API_KEY_FILE: ""
        WHAT_THE_REPO_COS_SECRET_ID: ""
        WHAT_THE_REPO_COS_SECRET_ID_FILE: ""
        WHAT_THE_REPO_COS_SECRET_KEY: ""
        WHAT_THE_REPO_COS_SECRET_KEY_FILE: ""
        WHAT_THE_REPO_COS_SECURITY_TOKEN: ""
        WHAT_THE_REPO_COS_SECURITY_TOKEN_FILE: ""
        WHAT_THE_REPO_MCP_TOKEN: ""
        WHAT_THE_REPO_MCP_TOKEN_FILE: ""
        WHAT_THE_REPO_MCP_TOKENS_JSON: ""
        WHAT_THE_REPO_MCP_TOKENS_JSON_FILE: ""
        WHAT_THE_REPO_METRICS_TOKEN: ""
        WHAT_THE_REPO_METRICS_TOKEN_FILE: ""
        WHAT_THE_REPO_ANALYSIS_PROVIDER_API_KEY: ""
        WHAT_THE_REPO_ANALYSIS_PROVIDER_API_KEY_FILE: ""
        WHAT_THE_REPO_WEB_SEARCH_API_KEY: ""
        WHAT_THE_REPO_WEB_SEARCH_API_KEY_FILE: ""
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/postgres_admin_database_url
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/key_encryption_secret
      WHAT_THE_REPO_COS_SECRET_ID_FILE: /run/secrets/cos_secret_id
      WHAT_THE_REPO_COS_SECRET_KEY_FILE: /run/secrets/cos_secret_key
    secrets:
      - key_encryption_secret
      - cos_secret_id
      - cos_secret_key
      - postgres_admin_database_url
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  api:
    environment:
      <<: *clear-server-secrets
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/postgres_runtime_database_url
      GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      WHAT_THE_REPO_SESSION_SECRET_FILE: /run/secrets/session_secret
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/key_encryption_secret
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
      WHAT_THE_REPO_FEEDBACK_PROVIDER_API_KEY_FILE: /run/secrets/feedback_provider_api_key
      WHAT_THE_REPO_COS_SECRET_ID_FILE: /run/secrets/cos_secret_id
      WHAT_THE_REPO_COS_SECRET_KEY_FILE: /run/secrets/cos_secret_key
      WHAT_THE_REPO_MCP_TOKEN_FILE: /run/secrets/mcp_token
      WHAT_THE_REPO_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      WHAT_THE_REPO_ANALYSIS_PROVIDER_API_KEY_FILE: /run/secrets/analysis_provider_api_key
      WHAT_THE_REPO_WEB_SEARCH_API_KEY_FILE: /run/secrets/web_search_api_key
    secrets:
      - github_oauth_client_secret
      - session_secret
      - key_encryption_secret
      - free_provider_api_key
      - feedback_provider_api_key
      - cos_secret_id
      - cos_secret_key
      - mcp_token
      - metrics_token
      - postgres_runtime_database_url
      - analysis_provider_api_key
      - web_search_api_key
    ports: !reset []
    expose:
      - "8307"
    pids_limit: 512
    read_only: true
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=268435456,mode=1777

  analysis-worker:
    environment:
      <<: *clear-server-secrets
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/postgres_runtime_database_url
      GITHUB_OAUTH_CLIENT_SECRET_FILE: /run/secrets/github_oauth_client_secret
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/key_encryption_secret
      WHAT_THE_REPO_FREE_PROVIDER_API_KEY_FILE: /run/secrets/free_provider_api_key
      WHAT_THE_REPO_COS_SECRET_ID_FILE: /run/secrets/cos_secret_id
      WHAT_THE_REPO_COS_SECRET_KEY_FILE: /run/secrets/cos_secret_key
      WHAT_THE_REPO_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      WHAT_THE_REPO_ANALYSIS_PROVIDER_API_KEY_FILE: /run/secrets/analysis_provider_api_key
      WHAT_THE_REPO_WEB_SEARCH_API_KEY_FILE: /run/secrets/web_search_api_key
    secrets:
      - github_oauth_client_secret
      - key_encryption_secret
      - free_provider_api_key
      - cos_secret_id
      - cos_secret_key
      - metrics_token
      - postgres_runtime_database_url
      - analysis_provider_api_key
      - web_search_api_key
    pids_limit: 768
    read_only: true
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777

  scheduler:
    environment:
      <<: *clear-server-secrets
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/postgres_runtime_database_url
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/key_encryption_secret
      WHAT_THE_REPO_COS_SECRET_ID_FILE: /run/secrets/cos_secret_id
      WHAT_THE_REPO_COS_SECRET_KEY_FILE: /run/secrets/cos_secret_key
      WHAT_THE_REPO_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets:
      - key_encryption_secret
      - cos_secret_id
      - cos_secret_key
      - metrics_token
      - postgres_runtime_database_url
    pids_limit: 256
    read_only: true
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=67108864,mode=1777

  web:
    user: "101:101"
    pids_limit: 128
    read_only: true
    cap_drop: [ "ALL" ]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=16777216,uid=101,gid=101,mode=0755
      - /var/run:rw,nosuid,nodev,size=1048576,uid=101,gid=101,mode=0755

  prometheus:
    environment:
      WHAT_THE_REPO_METRICS_TOKEN: ""
      WHAT_THE_REPO_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets:
      - metrics_token
    pids_limit: 256

  alertmanager:
    pids_limit: 128

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ""
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
    secrets:
      - grafana_admin_password
    pids_limit: 256
  evolution-worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/postgres_runtime_database_url
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET: ""
      WHAT_THE_REPO_KEY_ENCRYPTION_SECRET_FILE: /run/secrets/key_encryption_secret
      WHAT_THE_REPO_EVOLUTION_PROVIDER_API_KEY: ""
      WHAT_THE_REPO_EVOLUTION_PROVIDER_API_KEY_FILE: /run/secrets/evolution_provider_api_key
    secrets:
      - postgres_runtime_database_url
      - key_encryption_secret
      - evolution_provider_api_key

secrets:
  postgres_admin_password:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-admin-password
  postgres_runtime_password:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-runtime-password
  postgres_admin_database_url:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-admin-database-url
  postgres_runtime_database_url:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-runtime-database-url
  github_oauth_client_secret:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/github-oauth-client-secret
  session_secret:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/session-secret
  key_encryption_secret:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/key-encryption-secret
  free_provider_api_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/free-provider-api-key
  feedback_provider_api_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/feedback-provider-api-key
  cos_secret_id:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/cos-secret-id
  cos_secret_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/cos-secret-key
  mcp_token:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/mcp-token
  metrics_token:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/metrics-token
  grafana_admin_password:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/grafana-admin-password
  postgres_backup_access_key_id:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-backup-access-key-id
  postgres_backup_secret_access_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/postgres-backup-secret-access-key
  analysis_provider_api_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/analysis-provider-api-key
  web_search_api_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/web-search-api-key
  evolution_provider_api_key:
    file: ${WTR_SECRET_ROOT:-.secrets/instance}/evolution-provider-api-key
