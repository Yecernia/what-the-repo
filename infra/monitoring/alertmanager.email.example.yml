global:
  smtp_smarthost: smtp.example.com:587
  smtp_from: alerts@example.com
  smtp_auth_username: alerts@example.com
  smtp_auth_password: REPLACE_WITH_SMTP_APP_PASSWORD
  smtp_require_tls: true

route:
  receiver: production-email
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: production-email
    email_configs:
      - to: REPLACE_WITH_RECEIVER_EMAIL
        send_resolved: true
