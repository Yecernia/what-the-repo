global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: what-the-repo-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/what-the-repo-metrics-token
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 8307

  - job_name: what-the-repo-analysis-worker
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/what-the-repo-metrics-token
    dns_sd_configs:
      - names:
          - analysis-worker
        type: A
        port: 9464

  - job_name: what-the-repo-scheduler
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/what-the-repo-metrics-token
    dns_sd_configs:
      - names:
          - scheduler
        type: A
        port: 9464
