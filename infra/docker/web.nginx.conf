limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_status 429;

upstream what_the_repo_api {
    zone what_the_repo_api 64k;
    least_conn;
    # Both Docker Compose and k3s provide the short `api` service name through
    # their own internal DNS. Resolving it at startup keeps this image portable
    # without baking a Docker-only resolver address into the production image.
    server api:8307;
    keepalive 32;
}

# When the optional host Nginx public edge is enabled, it forwards the
# original client address in X-Forwarded-For. Trust only the local proxy and
# private container/network ranges so the existing per-client limit remains
# meaningful at the edge.
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;

    include /etc/nginx/nginx-security-headers.conf;
    server_tokens off;
    client_max_body_size 2m;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Keep long-running chat progress observable instead of buffering it at the edge.
    location ~ ^/api/projects/[^/]+/messages/stream$ {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass http://what_the_repo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://what_the_repo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    # Vite emits content-hashed files, so they can be retained by browsers safely.
    location ~* ^/assets/ {
        include /etc/nginx/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/nginx-security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
