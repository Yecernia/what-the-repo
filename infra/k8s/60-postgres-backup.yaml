apiVersion: batch/v1
kind: CronJob
metadata:
  name: wtr-postgres-backup
  namespace: what-the-repo
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: what-the-repo
spec:
  schedule: "17 3 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/part-of: what-the-repo
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: postgres-backup
              image: what-the-repo-postgres-walg:__WTR_IMAGE_TAG__
              imagePullPolicy: Never
              command: ["/usr/local/bin/wtr-postgres-backup"]
              envFrom:
                - configMapRef:
                    name: wtr-config
              env:
                - name: WALG_FILE_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_FILE_PREFIX
                - name: WALG_S3_PREFIX
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_S3_PREFIX
                - name: WALG_PREVENT_WAL_OVERWRITE
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_PREVENT_WAL_OVERWRITE
                - name: WALG_S3_SSE
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_S3_SSE
                - name: AWS_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_AWS_ENDPOINT
                - name: AWS_REGION
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_AWS_REGION
                - name: AWS_S3_FORCE_PATH_STYLE
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_BACKUP_AWS_FORCE_PATH_STYLE
                - name: PGHOST
                  value: postgres
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_DB
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: wtr-config
                      key: POSTGRES_USER
                - name: PGDATA
                  value: /var/lib/postgresql/data
                - name: PGPASSWORD_FILE
                  value: /run/secrets/postgres-admin-password
                - name: AWS_ACCESS_KEY_ID_FILE
                  value: /run/secrets/access-key-id
                - name: AWS_SECRET_ACCESS_KEY_FILE
                  value: /run/secrets/secret-access-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: postgres-data
                  mountPath: /var/lib/postgresql/data
                  readOnly: true
                - name: backup-secrets
                  mountPath: /run/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: postgres-data
              persistentVolumeClaim:
                claimName: postgres-data
            - name: backup-secrets
              secret:
                secretName: wtr-backup-secrets
                defaultMode: 0444
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
