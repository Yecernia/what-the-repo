# These are deliberately explicit host paths rather than a second storage
# product: the first release has exactly one k3s node. Retain prevents an
# accidental PVC deletion from deleting the underlying server data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wtr-postgres-data
  labels:
    app.kubernetes.io/part-of: what-the-repo
spec:
  capacity:
    storage: 80Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/what-the-repo/k3s/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: what-the-repo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: wtr-postgres-data
  resources:
    requests:
      storage: 80Gi
---
